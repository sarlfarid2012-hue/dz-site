<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وَجْدَة DZ | سوق العروض وسلة المشتريات والدفع عند الاستلام (58 ولاية)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #006233;
            --primary-dark: #004725;
            --accent: #D21034;
            --gold: #f59e0b;
            --bg: #f1f5f9;
            --card: #ffffff;
            --dark: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--dark);
            line-height: 1.6;
            padding-bottom: 5.5rem;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1.8rem 1.5rem 3.8rem;
        }

        .header-inner {
            max-width: 1260px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 {
            font-size: 1.95rem;
            font-weight: 800;
        }

        header p {
            opacity: 0.92;
            font-size: 0.95rem;
        }

        .nav-actions {
            display: flex;
            gap: 0.55rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.16);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.28);
            padding: 0.58rem 1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: white;
            color: var(--primary-dark);
        }

        .nav-btn.seller-cta {
            background: var(--gold);
            color: var(--dark);
            border-color: var(--gold);
        }

        .badge {
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            padding: 1px 7px;
            border-radius: 99px;
        }

        .filter-wrapper {
            max-width: 1260px;
            margin: -1.9rem auto 2rem;
            padding: 0 1.2rem;
        }

        .filter-bar {
            background: var(--card);
            padding: 1rem;
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 0.75rem;
        }

        .filter-bar input,
        .filter-bar select {
            width: 100%;
            padding: 0.78rem 0.95rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        .filter-bar input:focus,
        .filter-bar select:focus {
            border-color: var(--primary);
        }

        .container {
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 1.2rem;
        }

        .top-bar-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            font-weight: 700;
            color: var(--muted);
        }

        .cod-pill {
            background: #dcfce7;
            color: #166534;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.85rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
            transition: transform 0.25s ease;
        }

        .card.in-compare {
            border-color: var(--primary);
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-img {
            position: relative;
            height: 210px;
            background: #e2e8f0;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loc-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.82);
            color: white;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: white;
            color: #cbd5e1;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .fav-btn.active {
            color: var(--accent);
        }

        .thumbs-strip {
            display: flex;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem 0;
        }

        .thumb-dot {
            width: 44px;
            height: 34px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid transparent;
            cursor: pointer;
            opacity: 0.75;
        }

        .thumb-dot.active {
            border-color: var(--primary);
            opacity: 1;
        }

        .card-body {
            padding: 0.95rem 1.2rem 1.2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .seller-tag {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
            gap: 0.4rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 0.35rem;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .price-tag {
            font-size: 1.28rem;
            font-weight: 800;
            color: var(--primary);
        }

        .cod-mini {
            font-size: 0.78rem;
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 700;
        }

        .free-ship-hint {
            font-size: 0.78rem;
            color: #0f766e;
            background: #f0fdfa;
            border: 1px solid #99f6e4;
            padding: 3px 8px;
            border-radius: 7px;
            margin-bottom: 0.55rem;
            font-weight: 700;
        }

        .specs-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.85rem;
        }

        .spec-chip {
            background: #f1f5f9;
            color: #334155;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .card-actions {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.45rem;
        }

        .btn {
            padding: 0.65rem 0.5rem;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.2s;
        }

        .btn-buy {
            background: var(--primary);
            color: white;
            grid-column: span 2;
            font-size: 0.95rem;
            padding: 0.75rem;
        }

        .btn-buy:hover {
            background: var(--primary-dark);
        }

        .btn-cart-add {
            background: #0f172a;
            color: white;
            grid-column: span 2;
            font-size: 0.9rem;
            padding: 0.68rem;
        }

        .btn-cart-add:hover {
            background: #1e293b;
        }

        .btn-comp {
            background: #e2e8f0;
            color: var(--dark);
        }

        .btn-comp.selected {
            background: var(--dark);
            color: white;
        }

        .btn-rev {
            background: #f8fafc;
            color: var(--dark);
            border: 1px solid var(--border);
        }

        .compare-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark);
            color: white;
            padding: 0.85rem 1.5rem;
            z-index: 90;
            display: none;
        }

        .compare-dock.visible {
            display: block;
        }

        .dock-inner {
            max-width: 1260px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.72);
            z-index: 120;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 840px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 20px;
            padding: 1.8rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1.1rem;
            left: 1.1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .form-grid {
            display: grid;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            width: 100%;
            padding: 0.78rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .free-ship-config-box {
            background: #ecfdf5;
            border: 1.5px solid #34d399;
            border-radius: 12px;
            padding: 0.95rem;
            margin-bottom: 0.9rem;
            display: grid;
            gap: 0.6rem;
        }

        .free-ship-toggle {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-weight: 800;
            color: #065f46;
            cursor: pointer;
        }

        .free-ship-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .ship-rate-row {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1.2fr;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            transition: 0.2s;
        }

        .ship-rate-row.reasonable {
            background: #f0fdf4;
            border-color: #22c55e;
        }

        .ship-rate-row.unreasonable {
            background: #fef2f2;
            border-color: #ef4444;
        }

        .ship-rate-row input {
            padding: 0.45rem 0.65rem;
            border-radius: 8px;
            font-weight: 800;
        }

        .ship-rate-row.reasonable input {
            border: 1.5px solid #16a34a;
            color: #15803d;
            background: white;
        }

        .ship-rate-row.unreasonable input {
            border: 1.5px solid #dc2626;
            color: #b91c1c;
            background: white;
        }

        .rate-pill-green {
            background: #16a34a;
            color: white;
            padding: 3px 9px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 700;
            text-align: center;
        }

        .rate-pill-red {
            background: #dc2626;
            color: white;
            padding: 3px 9px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 700;
            text-align: center;
        }

        .rate-pill-free {
            background: #0d9488;
            color: white;
            padding: 3px 9px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 700;
            text-align: center;
        }

        .four-images-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.7rem;
            background: #f8fafc;
            padding: 0.85rem;
            border-radius: 12px;
            border: 1px dashed #94a3b8;
        }

        .img-slot {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.55rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .img-slot label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--dark);
        }

        .img-slot input[type="file"] {
            padding: 0.35rem;
            font-size: 0.8rem;
            margin: 0;
        }

        .img-slot img {
            width: 100%;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            background: #f1f5f9;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 0.6rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid #cbd5e1;
            background: white;
            font-weight: 800;
            cursor: pointer;
        }

        .invoice-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 0.95rem;
            display: grid;
            gap: 0.45rem;
        }

        .invoice-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.92rem;
            gap: 0.5rem;
        }

        .invoice-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--primary-dark);
            border-top: 1px solid #cbd5e1;
            padding-top: 0.5rem;
            margin-top: 0.2rem;
        }

        .tabs {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 0.5rem 0.9rem;
            font-weight: 800;
            cursor: pointer;
            color: var(--muted);
            border-radius: 8px;
        }

        .tab-btn.active {
            background: #ecfdf5;
            color: var(--primary);
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .compare-table th, .compare-table td {
            border: 1px solid var(--border);
            padding: 0.8rem;
            text-align: right;
        }

        .compare-table th {
            background: #f8fafc;
            width: 140px;
        }

        .order-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-right: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 0.8rem;
        }

        @media (max-width: 850px) {
            .filter-bar {
                grid-template-columns: 1fr;
            }
            .four-images-grid {
                grid-template-columns: 1fr;
            }
            .ship-rate-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div>
                <h1><i class="fas fa-bolt" style="color: var(--gold);"></i> وَجْدَة DZ</h1>
                <p>سوق البائعين والمشترين في الجزائر (58 ولاية) — سلة مشتريات موحدة، توصيل مجاني تلقائي، والدفع عند الاستلام</p>
            </div>
            <div class="nav-actions">
                <button class="nav-btn active" id="navAll" onclick="switchPage('all')">
                    <i class="fas fa-shopping-bag"></i> السوق
                </button>
                <button class="nav-btn" id="navFav" onclick="switchPage('fav')">
                    <i class="fas fa-heart"></i> المفضلة <span class="badge" id="favBadge">0</span>
                </button>
                <button class="nav-btn" id="navCart" onclick="openCartModal()">
                    <i class="fas fa-shopping-cart"></i> السلة <span class="badge" id="cartBadge">0</span>
                </button>
                <button class="nav-btn" id="navMyOrders" onclick="openBuyerOrdersModal()">
                    <i class="fas fa-truck"></i> طلبياتي <span class="badge" id="ordersBadge">0</span>
                </button>
                <button class="nav-btn seller-cta" id="sellerAccountBtn" onclick="openSellerArea()">
                    <i class="fas fa-user-tie"></i> حساب البائع / أضف منتجاً
                </button>
            </div>
        </div>
    </header>

    <div class="filter-wrapper">
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج، ماركة، أو اسم البائع..." oninput="renderMarket()">
            <select id="wilayaFilter" onchange="renderMarket()"></select>
            <select id="catFilter" onchange="renderMarket()">
                <option value="all">كل الفئات</option>
                <option value="هواتف وإلكترونيات">هواتف وإلكترونيات</option>
                <option value="أنظمة أمن وكاميرات">أنظمة أمن وكاميرات</option>
                <option value="حواسيب">حواسيب</option>
                <option value="أجهزة منزلية">أجهزة منزلية</option>
                <option value="أخرى">أخرى</option>
            </select>
            <select id="sortFilter" onchange="renderMarket()">
                <option value="newest">الأحدث أولاً</option>
                <option value="price-asc">السعر: الأقل أولاً</option>
                <option value="price-desc">السعر: الأعلى أولاً</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div class="top-bar-info">
            <span id="marketStatus">جاري تحميل العروض...</span>
            <span class="cod-pill"><i class="fas fa-map-marked-alt"></i> تغطية 58 ولاية + توصيل مجاني تلقائي + الدفع عند الاستلام</span>
        </div>
        <div class="grid" id="marketGrid"></div>
    </div>

    <div class="compare-dock" id="compareDock">
        <div class="dock-inner">
            <div id="dockList" style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;"></div>
            <div style="display:flex; gap:0.5rem;">
                <button class="nav-btn seller-cta" onclick="openCompareModal()">قارن الآن (<span id="compCount">0</span>/3)</button>
                <button class="nav-btn" onclick="clearCompare()">مسح</button>
            </div>
        </div>
    </div>

    <div class="modal" id="sellerModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('sellerModal')"><i class="fas fa-times"></i></button>
            <div id="sellerModalContent"></div>
        </div>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-box" style="max-width: 680px;">
            <button class="close-btn" onclick="closeModal('cartModal')"><i class="fas fa-times"></i></button>
            <div id="cartModalContent"></div>
        </div>
    </div>

    <div class="modal" id="detailsModal">
        <div class="modal-box" style="max-width: 640px;">
            <button class="close-btn" onclick="closeModal('detailsModal')"><i class="fas fa-times"></i></button>
            <div id="detailsContent"></div>
        </div>
    </div>

    <div class="modal" id="compareModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('compareModal')"><i class="fas fa-times"></i></button>
            <h2><i class="fas fa-balance-scale"></i> مقارنة المنتجات المختارة</h2>
            <div id="compareTableWrap" style="overflow-x:auto;"></div>
        </div>
    </div>

    <div class="modal" id="buyerOrdersModal">
        <div class="modal-box" style="max-width: 680px;">
            <button class="close-btn" onclick="closeModal('buyerOrdersModal')"><i class="fas fa-times"></i></button>
            <h2><i class="fas fa-box-open"></i> طلبياتي (الدفع عند الاستلام)</h2>
            <div id="buyerOrdersContent" style="margin-top:1rem;"></div>
        </div>
    </div>

    <script>
        const ALL_WILAYAS_58 = [
            { code: "01", name: "أدرار" },
            { code: "02", name: "الشلف" },
            { code: "03", name: "الأغواط" },
            { code: "04", name: "أم البواقي" },
            { code: "05", name: "باتنة" },
            { code: "06", name: "بجاية" },
            { code: "07", name: "بسكرة" },
            { code: "08", name: "بشار" },
            { code: "09", name: "البليدة" },
            { code: "10", name: "البويرة" },
            { code: "11", name: "تمنراست" },
            { code: "12", name: "تبسة" },
            { code: "13", name: "تلمسان" },
            { code: "14", name: "تيارت" },
            { code: "15", name: "تيزي وزو" },
            { code: "16", name: "الجزائر العاصمة" },
            { code: "17", name: "الجلفة" },
            { code: "18", name: "جيجل" },
            { code: "19", name: "سطيف" },
            { code: "20", name: "سعيدة" },
            { code: "21", name: "سكيكدة" },
            { code: "22", name: "سيدي بلعباس" },
            { code: "23", name: "عنابة" },
            { code: "24", name: "قالمة" },
            { code: "25", name: "قسنطينة" },
            { code: "26", name: "المدية" },

        function calculateSellerShipping(sellerId, wilaya, sellerCartSubtotal) {
            const seller = sellers.find(s => s.id === sellerId);
            const baseRate = (seller && seller.shippingRates && seller.shippingRates[wilaya] !== undefined)
                ? Number(seller.shippingRates[wilaya])
                : (DEFAULT_SHIPPING_RATES[wilaya] || 750);

            const freeEnabled = Boolean(seller && seller.freeShippingEnabled);
            const threshold = Number(seller && seller.freeShippingThreshold) || 0;

            if (freeEnabled && threshold > 0 && sellerCartSubtotal >= threshold) {
                return {
                    cost: 0,
                    baseRate,
                    isFree: true,
                    threshold
                };
            }

            return {
                cost: baseRate,
                baseRate,
                isFree: false,
                threshold
            };
        }

        function addToCart(productId, openImmediately) {
            const p = products.find(item => item.id === productId);
            if (!p) return;

            const existing = cart.find(item => item.productId === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ productId: p.id, qty: 1 });

            saveAll();
            renderMarket();
            if (openImmediately) {
                openCartModal();
            }
        }

        function updateCartQty(productId, delta) {
            const idx = cart.findIndex(item => item.productId === productId);

            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) {
                cart.splice(idx, 1);
            }
            saveAll();
            renderMarket();
            renderCartModalContent();
        }

        function recalculateCartTotals() {
            const wilayaEl = document.getElementById("cartBuyerWilaya");
            const invoiceBox = document.getElementById("cartInvoiceBox");
            if (!wilayaEl || !invoiceBox) return;

            const wilaya = wilayaEl.value;
            const validItems = cart
                .map(c => ({ ...c, product: products.find(p => p.id === c.productId) }))
                .filter(c => c.product);

            const itemsSubtotal = validItems.reduce((sum, i) => sum + (i.product.price * i.qty), 0);

            const sellerSubtotals = {};
            validItems.forEach(item => {
                const sId = item.product.sellerId;
                sellerSubtotals[sId] = (sellerSubtotals[sId] || 0) + (item.product.price * item.qty);
            });

            let totalShipping = 0;

            const sellerShippingLines = Object.keys(sellerSubtotals).map(sId => {
                const seller = sellers.find(s => s.id === sId);
                const sName = seller ? seller.storeName : "متجر";
                const sSubtotal = sellerSubtotals[sId];
                const calc = calculateSellerShipping(sId, wilaya, sSubtotal);
                totalShipping += calc.cost;

                if (calc.isFree) {
                    return `
                        <div class="invoice-line">
                            <span>توصيل (${sName} ← ${wilaya}):</span>
                            <span class="rate-pill-free">مجاني تلقائياً (تجاوز ${formatDZD(calc.threshold)})</span>
                        </div>
                    `;
                }

                const ok = isReasonableShipping(calc.baseRate);
                const remainderMsg = (seller && seller.freeShippingEnabled && calc.threshold > sSubtotal)
                    ? ` <small style="color:#0f766e;">(أضف ${formatDZD(calc.threshold - sSubtotal)} للتوصيل المجاني)</small>`
                    : "";

                return `
                    <div class="invoice-line">
                        <span>توصيل (${sName} ← ${wilaya})${remainderMsg}:</span>
                        <span class="${ok ? "rate-pill-green" : "rate-pill-red"}">
                            ${formatDZD(calc.cost)} (${ok ? "سعر معقول" : "سعر مرتفع"})
                        </span>
                    </div>
                `;
            }).join("");

            const grandTotal = itemsSubtotal + totalShipping;

            invoiceBox.innerHTML = `
                <div class="invoice-line">
                    <span>مجموع المنتجات (${validItems.length} أصناف):</span>
                    <strong>${formatDZD(itemsSubtotal)}</strong>
                </div>
                ${sellerShippingLines}
                <div class="invoice-total">
                    <span>المبلغ الإجمالي عند الاستلام:</span>
                    <span>${formatDZD(grandTotal)}</span>
                </div>
            `;
        }

        function confirmMultiProductOrder() {
            const buyerName = document.getElementById("cartBuyerName").value.trim();
            const buyerPhone = document.getElementById("cartBuyerPhone").value.trim();
            const buyerWilaya = document.getElementById("cartBuyerWilaya").value;
            const buyerAddress = document.getElementById("cartBuyerAddress").value.trim();

            if (!buyerName || !buyerPhone || !buyerAddress) {
                return alert("يرجى إدخال الاسم ورقم الهاتف وعنوان التوصيل.");
            }

            const validItems = cart
                .map(c => ({ ...c, product: products.find(p => p.id === c.productId) }))
                .filter(c => c.product);

            if (validItems.length === 0) return;

            const itemsSubtotal = validItems.reduce((sum, i) => sum + (i.product.price * i.qty), 0);

            const sellerSubtotals = {};
            validItems.forEach(item => {
                const sId = item.product.sellerId;
                sellerSubtotals[sId] = (sellerSubtotals[sId] || 0) + (item.product.price * item.qty);
            });

            const shippingCost = Object.keys(sellerSubtotals).reduce((sum, sId) => {
                return sum + calculateSellerShipping(sId, buyerWilaya, sellerSubtotals[sId]).cost;
            }, 0);

            const totalPrice = itemsSubtotal + shippingCost;

            orders.unshift({
                id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
                items: validItems.map(i => ({
                    productId: i.product.id,
                    productTitle: i.product.title,
                    sellerId: i.product.sellerId,
                    sellerName: i.product.sellerName,
                    unitPrice: i.product.price,
                    qty: i.qty
                })),
                buyerName,
                buyerPhone,
                buyerWilaya,
                buyerAddress,
                itemsSubtotal,
                shippingCost,
                totalPrice,
                paymentMethod: "الدفع عند الاستلام",
                date: new Date().toLocaleDateString("ar-DZ")
            });

            cart = [];
            saveAll();
            renderMarket();
            closeModal("cartModal");
            openBuyerOrdersModal();
        }

        function handleSellerLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPass").value.trim();
            const found = sellers.find(s => s.email === email && s.password === pass);
            if (!found) return alert("بيانات الدخول غير صحيحة.");
            found.shippingRates = { ...DEFAULT_SHIPPING_RATES, ...(found.shippingRates || {}) };
            if (found.freeShippingEnabled === undefined) found.freeShippingEnabled = false;

            saveAll();
            renderSellerDashboard("add");

        function handleSellerRegister() {
            const storeName = document.getElementById("regStore").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPass").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const wilaya = document.getElementById("regWilaya").value;
            const address = document.getElementById("regAddress").value.trim();

            if (!storeName || !email || !password || !phone || !address) {
                return alert("يرجى ملء جميع بيانات المتجر والموقع.");
            }
            if (sellers.some(s => s.email === email)) {
                return alert("هذا البريد مسجل مسبقاً.");
            }

            const newSeller = {
                id: "seller_" + Date.now(),
                storeName,
                email,
                password,
                phone,
                wilaya,
                address,
                shippingRates: { ...DEFAULT_SHIPPING_RATES },
                freeShippingEnabled: true,
                freeShippingThreshold: 15000

            sellers.push(newSeller);
            currentSeller = newSeller;
            saveAll();
            renderSellerDashboard("shipping");

        function handleFourImageUpload(slotIndex, inputEl) {
            const file = inputEl.files && inputEl.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                uploadedFourImages[slotIndex] = e.target.result;
                const previewEl = document.getElementById(`previewImg_${slotIndex}`);
                if (previewEl) previewEl.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function onSellerRateInput(idx, inputEl) {
            const val = Number(inputEl.value);
            const row = document.getElementById(`shipRow_${idx}`);
            const badge = document.getElementById(`shipBadge_${idx}`);
            const ok = isReasonableShipping(val);

            row.classList.toggle("reasonable", ok);
            row.classList.toggle("unreasonable", !ok);
            badge.className = ok ? "rate-pill-green" : "rate-pill-red";
            badge.textContent = ok
                ? "سعر معقول (مقبول)"
                : (val > REASONABLE_MAX ? "مرتفع عن الحد المعقول" : "أقل من الحد المعقول");
        }

        function saveSellerShippingRates() {
            const updated = {};
            ALL_WILAYAS_58.forEach((w, idx) => {
                const input = document.getElementById(`shipInput_${idx}`);
                updated[w.name] = Math.max(0, parseInt(input.value, 10) || 0);
            });

            const freeEnabled = document.getElementById("freeShipEnabledInput").checked;
            const threshold = Math.max(0, parseInt(document.getElementById("freeShipThresholdInput").value, 10) || 0);

            currentSeller.shippingRates = updated;
            currentSeller.freeShippingEnabled = freeEnabled;
            currentSeller.freeShippingThreshold = threshold;

            const sIdx = sellers.findIndex(s => s.id === currentSeller.id);
            if (sIdx !== -1) {
                sellers[sIdx].shippingRates = updated;
                sellers[sIdx].freeShippingEnabled = freeEnabled;
                sellers[sIdx].freeShippingThreshold = threshold;
            }

            saveAll();
            renderMarket();
            alert("تم حفظ أسعار التوصيل للـ 58 ولاية وإعدادات التوصيل المجاني بنجاح.");
        }

        function publishProduct() {
            const title = document.getElementById("pTitle").value.trim();
            const category = document.getElementById("pCat").value;
            const price = parseInt(document.getElementById("pPrice").value, 10);
            const wilaya = document.getElementById("pWilaya").value || currentSeller.wilaya;
            const exactAddress = document.getElementById("pAddress").value.trim() || currentSeller.address;
            const spec1 = document.getElementById("pSpec1").value.trim() || "جديد";
            const spec2 = document.getElementById("pSpec2").value.trim() || "متوفر";
            const description = document.getElementById("pDesc").value.trim() || "منتج متوفر للطلب المباشر والدفع عند الاستلام.";

            if (!title || !price || price <= 0) {
                return alert("يرجى إدخال اسم المنتج والسعر.");
            }

            const finalImages = uploadedFourImages.map(img => img || DEFAULT_IMG);

            products.unshift({
                id: Date.now(),
                sellerId: currentSeller.id,
                sellerName: currentSeller.storeName,
                sellerPhone: currentSeller.phone,
                title,
                category,
                price,
                wilaya,
                exactAddress,
                images: finalImages,
                description,
                specs: { "المواصفة": spec1, "الضمان / الحالة": spec2 },
                reviews: []
            });

            uploadedFourImages = [null, null, null, null];
            saveAll();
            renderMarket();
            renderSellerDashboard("products");
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            cart = cart.filter(c => c.productId !== id);
            saveAll();
            renderMarket();
            renderSellerDashboard("products");
        }

            favorites = favorites.includes(id)
                ? favorites.filter(item => item !== id)
                : [...favorites, id];
            saveAll();
            renderMarket();

            if (compareIds.includes(id)) {

            updateDock();
            renderMarket();

            renderMarket();

                <div style="margin:0.6rem 0;">
                    ${p.reviews.length ? p.reviews.map(r => `
                        <div style="border-bottom:1px solid var(--border); padding:0.6rem 0;">
                            <strong>${r.user}</strong> — <span style="color:var(--gold);">${"★".repeat(r.stars)}</span>
                            <p>${r.text}</p>
                        </div>
                    `).join("") : "<p style='color:var(--muted);'>لا توجد تعليقات بعد.</p>"}
                </div>

                <div class="form-grid" style="background:#f8fafc; padding:1rem; border-radius:12px;">
                    <strong>أضف تعليقك:</strong>
                    <input type="text" id="revUser" placeholder="اسمك">
                    <select id="revStars">
                        <option value="5">5 نجوم</option>
                        <option value="4">4 نجوم</option>
                        <option value="3">3 نجوم</option>
                    </select>
                    <textarea id="revText" rows="2" placeholder="اكتب رأيك..."></textarea>
                    <button class="btn btn-comp selected" onclick="submitProductReview(${p.id})">نشر التعليق</button>
                </div>
            `;
            document.getElementById("detailsModal").classList.add("active");
        }

        function submitProductReview(id) {
            const p = products.find(item => item.id === id);
            const user = document.getElementById("revUser").value.trim();
            const stars = parseInt(document.getElementById("revStars").value, 10);
            const text = document.getElementById("revText").value.trim();
            if (!user || !text) return alert("اكتب اسمك وتعليقك.");
            p.reviews.unshift({ user, stars, text });
            saveAll();
            renderMarket();
            openDetailsModal(id);
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove("active");
        }

        populateWilayaFilterDropdown();
        updateHeaderUI();
        renderMarket();
    </script>
</body>
</html>
